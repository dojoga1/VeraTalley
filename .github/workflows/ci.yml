name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same branch cancels the run already in progress. On a
# private repository CI minutes are metered, and there is no value in finishing
# a run against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"

jobs:
  # Every check runs in one job on purpose. Splitting them across jobs looks
  # tidier but each job reinstalls the whole dependency tree, which triples the
  # billed minutes for no extra signal.
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate the Prisma client
        run: pnpm --filter @veratalley/db generate

      - name: Check formatting
        run: pnpm format:check

      - name: Compile contracts
        run: pnpm --filter @veratalley/contracts compile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Types are generated from the three frozen contracts. If someone edits a
      # contract and does not commit the regenerated output, the repository is
      # internally inconsistent and the next person to pull gets errors that
      # look like their own fault. Fail here instead.
      - name: Check generated types are committed
        run: |
          pnpm gen
          if ! git diff --quiet; then
            echo "::error::Generated files are out of date. Run 'pnpm gen' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Check gas snapshots
        run: pnpm --filter @veratalley/contracts run test:solidity -- --snapshot-check

      - name: Build
        run: pnpm build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          # gitleaks scans history, not just the tip. A key committed three
          # commits ago and "removed" in the fourth is still in the repository
          # and still has to be rotated.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=8.28.0
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for committed secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
